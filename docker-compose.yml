# Deploy do piloto de uma oficina. Ver deploy/DEPLOY.md para HTTPS, backup e o passo a passo completo.
# Uso: copie .env.example para .env, preencha os valores e rode `docker compose up -d --build`.

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Não publique 5432 para fora do host em produção; descomente só para depuração local.
    # ports: ["5432:5432"]

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: 8080
      IAM_BOOTSTRAP_OWNER_NAME: ${IAM_BOOTSTRAP_OWNER_NAME}
      IAM_BOOTSTRAP_OWNER_EMAIL: ${IAM_BOOTSTRAP_OWNER_EMAIL}
      IAM_BOOTSTRAP_OWNER_PASSWORD: ${IAM_BOOTSTRAP_OWNER_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
