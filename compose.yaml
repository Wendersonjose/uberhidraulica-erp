services:
  postgres:
    image: postgres:18-alpine
    container_name: uberhidraulica-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-uberhidraulica}
      POSTGRES_USER: ${POSTGRES_USER:-uberhidraulica}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uberhidraulica_dev}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - uberhidraulica_postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-uberhidraulica} -d ${POSTGRES_DB:-uberhidraulica}
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  uberhidraulica_postgres_data: