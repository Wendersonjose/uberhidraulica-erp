# Cabeçalhos de segurança comuns às respostas servidas pelo nginx (frontend estático).
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
# HSTS só faz sentido com HTTPS ativo: ative depois de confirmar que todo o tráfego chega por HTTPS, para não
# travar quem ainda acessa por HTTP.
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
