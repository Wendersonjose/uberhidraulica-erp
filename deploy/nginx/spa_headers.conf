# Política de conteúdo do SPA. O build do Vite só carrega scripts e estilos do próprio domínio; o React usa o
# atributo `style` em alguns componentes, por isso style-src admite 'unsafe-inline' (scripts continuam restritos).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
