# Cabeçalhos encaminhados ao backend. server.forward-headers-strategy=framework (application-prod.yml)
# usa X-Forwarded-For/-Proto para que o IP real do cliente chegue à evidência do orçamento público
# (TASK-0008, finding F-08-02) em vez do IP deste proxy.
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
