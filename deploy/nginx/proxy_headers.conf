# Cabeçalhos encaminhados ao backend. server.forward-headers-strategy=framework (application-prod.yml) usa o
# primeiro valor de X-Forwarded-For como IP do cliente — é a evidência do orçamento público (TASK-0008, F-08-02).
#
# Por isso este nginx SOBRESCREVE o X-Forwarded-For com $remote_addr em vez de anexar a ele
# ($proxy_add_x_forwarded_for): anexar manteria o valor que o próprio cliente enviou na frente, e o backend
# gravaria o IP que o cliente quisesse. $remote_addr é o IP da conexão, ou — somente quando a conexão vem de um
# proxy listado em TRUSTED_PROXY_CIDRS — o IP real que esse proxy informou (real_ip.conf).
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_http_version 1.1;
