# Reverse proxy do piloto: serve o frontend estático e encaminha /api e /actuator/health para o backend.
# Mesma origem para o navegador (sem CORS). TLS: ver deploy/DEPLOY.md — este arquivo assume que HTTPS é
# terminado aqui ou por um proxy na frente (dependente do provedor de hospedagem, documentado à parte).

limit_req_zone $binary_remote_addr zone=public_quote:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Cabeçalhos de segurança básicos. HSTS só faz sentido com HTTPS ativo (ver DEPLOY.md); ative a linha
    # abaixo depois de confirmar que todo o tráfego chega por HTTPS, para não travar o primeiro acesso HTTP.
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 5m;

    location /api/public/ {
        limit_req zone=public_quote burst=5 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
