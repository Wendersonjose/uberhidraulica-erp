# Reverse proxy do piloto: serve o frontend estático e encaminha /api e /actuator/health ao backend.
# Mesma origem para o navegador (sem CORS). TLS: ver docs/architecture/devops/DEPLOY-piloto.md — este arquivo
# assume que o HTTPS é terminado aqui ou por um proxy na frente (depende do provedor de hospedagem).

server_tokens off;

# Limites por IP. 429 em vez do 503 padrão para o cliente (e o frontend) distinguirem excesso de requisições.
limit_req_status 429;
limit_req_zone $binary_remote_addr zone=public_quote:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=login:10m rate=6r/m;

# O token do link público viaja na URL (/orcamento/<token> e /api/public/quotes/<token>/...). O log de acesso vai
# para o stdout do container e de lá para qualquer coletor de logs: gravar o token ali entregaria o link a quem lê
# o log. Por isso a URI e o Referer (a página do link é a origem das chamadas da API) são gravados mascarados.
map $request_uri $log_uri {
    ~^(?<uri_head>/(?:orcamento|api/public/quotes)/)[^/?\s]+(?<uri_tail>.*)$  "${uri_head}[token]${uri_tail}";
    default                                                                   $request_uri;
}
map $http_referer $log_referer {
    ~^(?<ref_head>[a-z]+://[^/]+/(?:orcamento|api/public/quotes)/)[^/?\s]+(?<ref_tail>.*)$  "${ref_head}[token]${ref_tail}";
    default                                                                                  $http_referer;
}
log_format erp '$remote_addr - $remote_user [$time_local] "$request_method $log_uri $server_protocol" '
               '$status $body_bytes_sent "$log_referer" "$http_user_agent"';

# Proxies confiáveis (TRUSTED_PROXY_CIDRS) e o esquema encaminhado: este arquivo é GERADO na subida do container por
# docker-entrypoint.d/40-trusted-proxies.sh e define o mapa $forwarded_proto. Só uma conexão vinda de um proxy
# confiável pode afirmar "https" em X-Forwarded-Proto; de qualquer outra origem o cabeçalho é ignorado.
include /etc/nginx/trusted_proxies_http.conf;

server {
    listen 80;
    server_name _;

    # No nível do server para SUBSTITUIR o access_log padrão (que gravaria o token); o log de erros não leva a URL.
    access_log /var/log/nginx/access.log erp;

    # IP real do cliente. Vazio (padrão): vale o IP da conexão, e X-Forwarded-For do cliente é ignorado. Com
    # TRUSTED_PROXY_CIDRS, só os endereços listados podem informar o IP real (set_real_ip_from + real_ip_recursive:
    # vale o primeiro endereço NÃO confiável lido da direita para a esquerda, então um valor forjado pelo cliente
    # à esquerda nunca é usado). Gerado por docker-entrypoint.d/40-trusted-proxies.sh.
    include /etc/nginx/real_ip.conf;

    client_max_body_size 5m;

    # Cabeçalhos de segurança em TODA resposta. O nginx só herda `add_header` do nível acima quando o bloco não
    # declara nenhum próprio, então cada location inclui este arquivo em vez de depender da herança.
    # HSTS: ative a linha de security_headers.conf depois de confirmar que todo o tráfego chega por HTTPS.

    location = /api/iam/auth/login {
        limit_req zone=login burst=20 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/public/ {
        limit_req zone=public_quote burst=5 nodelay;
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    location /actuator/health {
        proxy_pass http://backend:8080;
        include /etc/nginx/proxy_headers.conf;
    }

    # Só o health é publicado. O backend também só expõe esse endpoint; aqui o resto vira 404 em vez de cair no SPA.
    location /actuator/ {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/security_headers.conf;
        include /etc/nginx/spa_headers.conf;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security_headers.conf;
        include /etc/nginx/spa_headers.conf;
    }
}
